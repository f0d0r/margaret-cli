name: Build

on: push

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Project Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Generate SQLc code
        run: |
          make generate
          git diff --exit-code -- internal/db

      - name: Go Tidy Check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Go Mod Verify
        run: go mod verify

      - name: Run golangci-lint
        run: go tool golangci-lint run ./...

      - name: Run govulncheck
        run: go tool govulncheck -test ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Project Build
        run: make build